name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-fastapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Raccord_Codigo/raccord_backend/api_usuarios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Raccord_Codigo/raccord_backend/api_usuarios/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # pytest corre con cobertura y falla si baja del umbral (fail_under en pyproject.toml).
      - run: python -m pytest

  frontend-flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Raccord_Codigo/raccord_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # --coverage genera coverage/lcov.info; el umbral se exige en el paso siguiente.
      - run: flutter test --coverage
      - name: Exigir umbral de cobertura (frontend)
        run: |
          UMBRAL=$(cat coverage_threshold.txt)
          python3 - "$UMBRAL" <<'EOF'
          import sys
          umbral = float(sys.argv[1])
          hit = total = 0
          for linea in open("coverage/lcov.info"):
              if linea.startswith("LF:"):
                  total += int(linea[3:])
              elif linea.startswith("LH:"):
                  hit += int(linea[3:])
          pct = 100 * hit / total if total else 0
          # Detalle por archivo (los que más líneas sin cubrir tienen primero),
          # para saber dónde conviene escribir el siguiente test.
          archivos, actual = [], None
          for linea in open("coverage/lcov.info"):
              if linea.startswith("SF:"):
                  actual = [linea[3:].strip(), 0, 0]
              elif linea.startswith("LF:"):
                  actual[1] = int(linea[3:])
              elif linea.startswith("LH:"):
                  actual[2] = int(linea[3:])
              elif linea.startswith("end_of_record") and actual:
                  archivos.append(actual)
          for nombre, lf, lh in sorted(archivos, key=lambda a: a[2] - a[1]):
              print(f"  {lh:5d}/{lf:<5d} {100 * lh / lf if lf else 0:6.1f}%  sin cubrir {lf - lh:5d}  {nombre}")
          print(f"Cobertura frontend: {pct:.2f}% (umbral {umbral}%)")
          sys.exit(0 if pct >= umbral else 1)
          EOF

  evidencia-individual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commits de test por autor esta semana
        run: |
          echo "### Commits de test por autor desde el lunes" >> "$GITHUB_STEP_SUMMARY"
          git shortlog -sn --since="last Monday" HEAD -- '*tests/*' '*/test/*' '*_test.dart' '*e2e/*' >> "$GITHUB_STEP_SUMMARY"
