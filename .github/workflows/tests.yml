name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Pruebas unitarias del backend: sin base de datos. Los tests de integración
  # (tests/integracion) se saltan aquí a propósito y corren en el job
  # "integration", con PostgreSQL como servicio. -rs lista cada salto y su razón.
  backend-fastapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Raccord_Codigo/raccord_backend/api_usuarios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Raccord_Codigo/raccord_backend/api_usuarios/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # pytest corre con cobertura y falla si baja del umbral (fail_under en pyproject.toml).
      - run: python -m pytest -rs --cov-report=html:htmlcov
      # El reporte HTML permite ver las ramas/líneas sin cubrir sin reproducir en local.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-backend
          path: Raccord_Codigo/raccord_backend/api_usuarios/htmlcov/
          retention-days: 7

  # Semana 8 — integración con la BD real. Misma imagen y mismas migraciones que
  # en el equipo (docker-compose.test.yml): postgres:18 + sql/0*.sql en orden.
  # Cero tests saltados: sin DATABASE_URL se saltarían y el job saldría en verde
  # sin probar nada (el "CI que miente"), por eso se verifica el conteo.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: raccord_test
          POSTGRES_PASSWORD: raccord_test
          POSTGRES_DB: raccord_test
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U raccord_test -d raccord_test"
          --health-interval 2s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg2://raccord_test:raccord_test@localhost:5433/raccord_test
      PGPASSWORD: raccord_test
    defaults:
      run:
        working-directory: Raccord_Codigo/raccord_backend/api_usuarios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Raccord_Codigo/raccord_backend/api_usuarios/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Las migraciones de producción, en orden (igual que tests/db/init-esquema.sh).
      # Los .sql pueden traer saltos de línea de Windows: se quita el \r.
      - name: Aplicar migraciones
        run: |
          for archivo in sql/0*.sql; do
            echo "Aplicando $archivo"
            tr -d '\r' < "$archivo" | psql -v ON_ERROR_STOP=1 --quiet -h localhost -p 5433 -U raccord_test -d raccord_test
          done
      - name: Tests de integración
        run: python -m pytest tests/integracion -rs --no-cov --junitxml=integracion.xml
      - name: Exigir cero tests saltados
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          suite = ET.parse("integracion.xml").getroot()
          suite = suite if suite.tag == "testsuite" else suite[0]
          tests, saltados = int(suite.get("tests")), int(suite.get("skipped"))
          print(f"Integración: {tests} tests, {saltados} saltados")
          assert tests > 0, "no se ejecutó ningún test de integración"
          assert saltados == 0, "hay tests de integración saltados: ¿llegó DATABASE_URL?"
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integracion-junit
          path: Raccord_Codigo/raccord_backend/api_usuarios/integracion.xml
          retention-days: 7

  # Semana 8 — E2E (Playwright). Todo corre en la máquina del job:
  #   PostgreSQL (servicio) + backend (lo levanta Playwright con su webServer) +
  #   frontend Flutter Web compilado desde este mismo commit.
  # Como el frontend se compila aquí, ya trae las correcciones de la S7
  # (`_loading`): E2E_FRONT_CORREGIDO=true y los tests de doble clic corren normal.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: raccord_test
          POSTGRES_PASSWORD: raccord_test
          POSTGRES_DB: raccord_test
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U raccord_test -d raccord_test"
          --health-interval 2s
          --health-retries 15
    env:
      PGPASSWORD: raccord_test
      WEB_URL: http://127.0.0.1:8081
      E2E_FRONT_CORREGIDO: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Migraciones de la BD de pruebas
        working-directory: Raccord_Codigo/raccord_backend/api_usuarios
        run: |
          for archivo in sql/0*.sql; do
            tr -d '\r' < "$archivo" | psql -v ON_ERROR_STOP=1 --quiet -h localhost -p 5433 -U raccord_test -d raccord_test
          done

      # Sin MinIO en el CI, a propósito: MinIO dejó de publicar su imagen en Docker Hub
      # ("pull access denied") y la de quay.io responde 401, así que no hay una imagen
      # estable que fijar. Los flujos E2E actuales (registro, personajes, proyectos) no
      # suben archivos y el backend tolera que MinIO no esté (ensure_buckets registra el
      # error y sigue). Si se agrega un E2E de subida de guion o foto, hay que levantar
      # aquí un almacenamiento S3 compatible.

      # Backend: lo arranca Playwright (webServer en playwright.config.js).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Raccord_Codigo/raccord_backend/api_usuarios/requirements*.txt
      - run: pip install -r requirements.txt
        working-directory: Raccord_Codigo/raccord_backend/api_usuarios

      # Frontend: build web desde el código del commit y servido en :8081.
      # El repo de pruebas no versiona raccord_flutter/web: se regenera.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Compilar Flutter Web
        working-directory: Raccord_Codigo/raccord_flutter
        run: |
          flutter create . --platforms web
          flutter pub get
          flutter build web --release --pwa-strategy=none --dart-define=API_BASE_URL=http://127.0.0.1:8000
      - name: Servir el frontend
        run: |
          python3 -m http.server 8081 --bind 127.0.0.1 --directory Raccord_Codigo/raccord_flutter/build/web > web.log 2>&1 &
          curl --silent --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:8081/

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: Raccord_Codigo/e2e/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: Raccord_Codigo/e2e/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: Raccord_Codigo/e2e
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: Raccord_Codigo/e2e

      # Sin pausas fijas: el webServer de Playwright espera al puerto 8000 y los
      # tests esperan con aserciones web-first.
      - run: pnpm test
        working-directory: Raccord_Codigo/e2e

      # Si algo falla: reporte HTML (con trazas y capturas) para diagnosticar sin reproducir.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            Raccord_Codigo/e2e/playwright-report/
            Raccord_Codigo/e2e/test-results/
          retention-days: 7

  frontend-flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Raccord_Codigo/raccord_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # --coverage genera coverage/lcov.info; el umbral se exige en el paso siguiente.
      - run: flutter test --coverage
      - name: Exigir umbral de cobertura (frontend)
        run: |
          UMBRAL=$(cat coverage_threshold.txt)
          python3 - "$UMBRAL" <<'EOF'
          import sys
          umbral = float(sys.argv[1])
          hit = total = 0
          for linea in open("coverage/lcov.info"):
              if linea.startswith("LF:"):
                  total += int(linea[3:])
              elif linea.startswith("LH:"):
                  hit += int(linea[3:])
          pct = 100 * hit / total if total else 0
          print(f"Cobertura frontend: {pct:.2f}% (umbral {umbral}%)")
          sys.exit(0 if pct >= umbral else 1)
          EOF

  evidencia-individual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commits de test por autor esta semana
        run: |
          echo "### Commits de test por autor desde el lunes" >> "$GITHUB_STEP_SUMMARY"
          git shortlog -sn --since="last Monday" HEAD -- '*tests/*' '*/test/*' '*_test.dart' '*e2e/*' >> "$GITHUB_STEP_SUMMARY"
