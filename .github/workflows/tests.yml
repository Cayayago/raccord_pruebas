name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-fastapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raccord_backend/api_usuarios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: raccord_backend/api_usuarios/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # pytest corre con cobertura y falla si baja del umbral (fail_under en pyproject.toml).
      - run: python -m pytest

  frontend-flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raccord_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # --coverage genera coverage/lcov.info; el umbral se exige en el paso siguiente.
      - run: flutter test --coverage
      - name: Exigir umbral de cobertura (frontend)
        run: |
          UMBRAL=$(cat coverage_threshold.txt)
          python3 - "$UMBRAL" <<'EOF'
          import sys
          umbral = float(sys.argv[1])
          hit = total = 0
          for linea in open("coverage/lcov.info"):
              if linea.startswith("LF:"):
                  total += int(linea[3:])
              elif linea.startswith("LH:"):
                  hit += int(linea[3:])
          pct = 100 * hit / total if total else 0
          print(f"Cobertura frontend: {pct:.2f}% (umbral {umbral}%)")
          sys.exit(0 if pct >= umbral else 1)
          EOF

  evidencia-individual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commits de test por autor esta semana
        run: |
          echo "### Commits de test por autor desde el lunes" >> "$GITHUB_STEP_SUMMARY"
          git shortlog -sn --since="last Monday" HEAD -- '*tests/*' '*/test/*' '*_test.dart' '*e2e/*' >> "$GITHUB_STEP_SUMMARY"
