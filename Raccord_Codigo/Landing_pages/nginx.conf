server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sin cache-busting por hash en estos archivos: se fuerza a que el
    # navegador siempre revalide con el servidor, para que un cambio de
    # copy/precios/etc. en la landing se vea de inmediato en vez de
    # quedar cacheado localmente (mismo criterio que raccord_flutter).
    location ~* ^/(index\.html|Styles\.css)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Página de una sola vista con anclas (#contacto, #servicios...), no
    # una SPA con rutas propias — no hace falta fallback a index.html
    # para cualquier path, a diferencia del frontend de Flutter.
    location / {
        try_files $uri $uri/ =404;
    }
}
