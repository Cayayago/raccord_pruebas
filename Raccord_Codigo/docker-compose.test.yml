# ==========================================
# RACCORD - BD de pruebas (semana 6)
# ==========================================
# PostgreSQL desechable para los tests de integración. Es APARTE de la BD de
# desarrollo (docker-compose.yml): otro contenedor, otro puerto (5433) y un
# nombre de BD que termina en "_test".
#
#   docker compose -f docker-compose.test.yml up -d --wait   # levantar
#   docker compose -f docker-compose.test.yml down -v        # apagar y borrar
#
# El esquema se crea igual que en producción: al arrancar con la BD vacía se
# aplican en orden los archivos raccord_backend/api_usuarios/sql/0*.sql
# (ver tests/db/init-esquema.sh). Con "down -v" se borra el volumen y la
# próxima vez vuelve a crearse desde cero.
#
# Las credenciales son solo de pruebas y viven aquí; los tests las reciben
# por la variable DATABASE_URL (ver README, sección 9).

# Proyecto propio: así "down -v" nunca toca el stack de desarrollo, que usa el
# mismo directorio y por defecto compartiría nombre de proyecto.
name: raccord-test

services:
  db-test:
    image: postgres:18
    container_name: raccord-db-test
    environment:
      POSTGRES_USER: raccord_test
      POSTGRES_PASSWORD: raccord_test
      POSTGRES_DB: raccord_test
    ports:
      - "5433:5432"
    volumes:
      - ./raccord_backend/api_usuarios/sql:/sql:ro
      - ./raccord_backend/api_usuarios/tests/db/init-esquema.sh:/docker-entrypoint-initdb.d/10-esquema.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raccord_test -d raccord_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Semana 7: almacenamiento de objetos aparte para los E2E (guiones y fotos).
  # Así las subidas de las pruebas no se mezclan con las de desarrollo.
  minio-test:
    image: minio/minio
    container_name: raccord-minio-test
    command: server /data
    environment:
      MINIO_ROOT_USER: raccord_test
      MINIO_ROOT_PASSWORD: raccord_test_secret
    ports:
      - "9100:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
