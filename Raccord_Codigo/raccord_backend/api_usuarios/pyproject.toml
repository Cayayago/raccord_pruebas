[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
omit = [
    # Sin lógica de negocio: scripts de operación manual, no se ejecutan en la app.
    "app/utils/encrypt_existing_objects.py",
]

[tool.coverage.report]
# Regla de trinquete: max(piso de la semana, cobertura real redondeada hacia abajo).
# Semana 2: piso 30, real 35.42 % -> 35.
# Semana 3: piso 40, real 41.29 % -> 41.
# Semana 4: piso 50, real 62.70 % (los tests de API recorren rutas y permisos) -> 62. Nunca bajar.
# (El 48 % de la semana 1 estaba en pytest.ini y solo contaba los archivos que
# importaba el único test; desde la semana 2 se mide TODO app/.)
# Semana 5: piso 60, real 64.59 % (508 tests) -> 64. Nunca bajar.
# Semana 6: piso 70, real 70.35 % (570 tests: reglas de actores y desglose + hallazgos
# de la BD real) -> 70. Nunca bajar.
# Semana 7: piso 75, real 75.10 % (632 tests: notificaciones, proyectos y departamentos)
# -> 75. Nunca bajar.
fail_under = 75
