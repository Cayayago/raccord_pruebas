server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html y main.dart.js son los que definen qué versión del
    # build se sirve. Sin cache-busting por hash, si el navegador los
    # cachea, sigue viendo el build viejo aunque el contenedor ya
    # tenga el nuevo. Se fuerza a que siempre se revalide con el
    # servidor en cada carga.
    location ~* ^/(index\.html|main\.dart\.js|flutter_bootstrap\.js|flutter\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
